name: forms-t2-clean

# Tester round 2: refit the form matcher without FUNSD (generic keywords and simulator labels); FUNSD test for evaluation only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MEDIA_DATA: /home/runner/media-data
  MEDIA_MODELS: /home/runner/media-models
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"

jobs:
  forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "media/requirements*.txt" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-liberation fonts-dejavu-core
      - run: pip install -r media/requirements.txt
      - id: m
        uses: actions/cache/restore@v4
        with: { path: /home/runner/media-models, key: "media-models-v1-${{ hashFiles('media/fetch.py') }}" }
      - if: steps.m.outputs.cache-hit != 'true'
        run: python media/fetch.py ocr_models
      - id: d
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/media-data/funsd
            /home/runner/media-data/sroie
            /home/runner/media-data/odb
          key: media-ocr-data-v1
      - if: steps.d.outputs.cache-hit != 'true'
        run: |
          python - <<'EOF'
          import os, sys, zipfile
          sys.path.insert(0, "media")
          from fetch import get
          from common import DATA
          fz = get("https://guillaumejaume.github.io/FUNSD/dataset.zip", os.path.join(DATA, "funsd", "dataset.zip"))
          zipfile.ZipFile(fz).extractall(os.path.join(DATA, "funsd"))
          EOF
      - id: f
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/media-data/forms_gen
            /home/runner/media-data/signverod
          key: "media-forms-v1-${{ hashFiles('media/forms/gen_forms.py', 'media/ocr/data.py', 'media/fetch.py') }}"
      - if: steps.f.outputs.cache-hit != 'true'
        run: python media/forms/gen_forms.py /home/runner/media-data/forms_gen 200
      - run: |
          mkdir -p out
          python media/forms/t2_forms_clean.py out 3000 media/forms/form_matcher_sim2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: forms-t2-clean, path: out/ }
